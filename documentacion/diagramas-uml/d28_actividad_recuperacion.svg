<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="959px" preserveAspectRatio="none" style="width:643px;height:959px;background:#FFFFFF;" version="1.1" viewBox="0 0 643 959" width="643px" zoomAndPan="magnify"><title>Actividad: guardado continuo y recuperaci&#243;n tras un cierre inesperado</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="DejaVu Sans" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="600.7031" x="20" y="33.9233">Actividad: guardado continuo y recuperaci&#243;n tras un cierre inesperado</text></g><ellipse cx="316.4106" cy="58.4609" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="none" height="362.1836" rx="4" ry="4" style="stroke:#000000;stroke-width:1.5;" width="327.8662" x="157.9185" y="78.4609"/><path d="M277.729,78.4609 L277.729,85.4297 L267.729,95.4297 L157.9185,95.4297" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="109.8105" x="160.9185" y="90.5996">Durante el trabajo</text><rect fill="#F5F8FD" height="33.9688" rx="4" ry="4" style="stroke:#1A5FB4;stroke-width:0.5;" width="264.8281" x="183.9966" y="112.4297"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="244.8281" x="193.9966" y="133.5684">Guardar / Posponer / Aceptar sugerencia</text><rect fill="#F5F8FD" height="47.9375" rx="4" ry="4" style="stroke:#1A5FB4;stroke-width:0.5;" width="257.1113" x="187.855" y="166.3984"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="237.1113" x="197.855" y="187.5371">A&#241;adir una l&#237;nea al final de cambios.tsv</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="170.7012" x="197.855" y="201.5059">y forzarla a disco (&#8776; 0,5 ms)</text><rect fill="#F5F8FD" height="33.9688" rx="4" ry="4" style="stroke:#1A5FB4;stroke-width:0.5;" width="266.4688" x="183.1763" y="234.3359"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="246.4688" x="193.1763" y="255.4746">A&#241;adir lo aprendido a memoria.diario.tsv</text><rect fill="#F5F8FD" height="47.9375" rx="4" ry="4" style="stroke:#1A5FB4;stroke-width:0.5;" width="286.748" x="173.0366" y="336.707"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="266.748" x="183.0366" y="357.8457">Escribir estado.tsv completo en un temporal</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="243.7148" x="183.0366" y="371.8145">y renombrarlo (at&#243;mico); vaciar el diario</text><polygon fill="#FFF4E0" points="242.5708,288.3047,390.2505,288.3047,402.2505,300.3047,390.2505,312.3047,242.5708,312.3047,230.5708,300.3047,242.5708,288.3047" style="stroke:#E37400;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="8.7871" x="320.4106" y="322.5151">s&#237;</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="147.6797" x="242.5708" y="304.459">&#191;M&#225;s de 2.000 cambios?</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="402.2505" y="297.7104">no</text><polygon fill="#FFF4E0" points="316.4106,404.6445,328.4106,416.6445,316.4106,428.6445,304.4106,416.6445,316.4106,404.6445" style="stroke:#E37400;stroke-width:0.5;"/><rect fill="none" height="456.1523" rx="4" ry="4" style="stroke:#000000;stroke-width:1.5;" width="298.3232" x="169.9185" y="450.6445"/><path d="M275.6255,450.6445 L275.6255,457.6133 L265.6255,467.6133 L169.9185,467.6133" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="95.707" x="172.9185" y="462.7832">Al volver a abrir</text><rect fill="#F5F8FD" height="33.9688" rx="4" ry="4" style="stroke:#1A5FB4;stroke-width:0.5;" width="255.2422" x="188.7896" y="484.6133"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="235.2422" x="198.7896" y="505.752">Leer inventario.tsv (equipos) y agrupar</text><rect fill="#F5F8FD" height="33.9688" rx="4" ry="4" style="stroke:#1A5FB4;stroke-width:0.5;" width="253.9883" x="189.4165" y="538.582"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="233.9883" x="199.4165" y="559.7207">Aplicar estado.tsv (&#250;ltima instant&#225;nea)</text><rect fill="#F5F8FD" height="33.9688" rx="4" ry="4" style="stroke:#1A5FB4;stroke-width:0.5;" width="214.0684" x="209.3765" y="592.5508"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="194.0684" x="219.3765" y="613.6895">Aplicar cambios.tsv l&#237;nea a l&#237;nea</text><rect fill="#F5F8FD" height="33.9688" rx="4" ry="4" style="stroke:#1A5FB4;stroke-width:0.5;" width="239.6621" x="196.5796" y="694.9219"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="219.6621" x="206.5796" y="716.0605">Descartarla (lo anterior est&#225; intacto)</text><polygon fill="#FFF4E0" points="215.6968,646.5195,417.1245,646.5195,429.1245,658.5195,417.1245,670.5195,215.6968,670.5195,203.6968,658.5195,215.6968,646.5195" style="stroke:#E37400;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="8.7871" x="320.4106" y="680.73">s&#237;</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="201.4277" x="215.6968" y="662.6738">&#191;La &#250;ltima l&#237;nea qued&#243; a medias?</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="429.1245" y="655.9253">no</text><polygon fill="#FFF4E0" points="316.4106,748.8906,328.4106,760.8906,316.4106,772.8906,304.4106,760.8906,316.4106,748.8906" style="stroke:#E37400;stroke-width:0.5;"/><rect fill="#F5F8FD" height="47.9375" rx="4" ry="4" style="stroke:#1A5FB4;stroke-width:0.5;" width="272.9844" x="179.9185" y="792.8906"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="252.9844" x="189.9185" y="814.0293">Cargar la memoria (memoria.tsv + diario)</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="147.6094" x="189.9185" y="827.998">y las propuestas de la IA</text><rect fill="#F5F8FD" height="33.9688" rx="4" ry="4" style="stroke:#1A5FB4;stroke-width:0.5;" width="219.541" x="206.6401" y="860.8281"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="199.541" x="216.6401" y="881.9668">Mostrar el grupo donde se qued&#243;</text><ellipse cx="316.4106" cy="937.7969" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="316.4106" cy="937.7969" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#44546A;stroke-width:1;" x1="316.4106" x2="316.4106" y1="146.3984" y2="166.3984"/><polygon fill="#44546A" points="312.4106,156.3984,316.4106,166.3984,320.4106,156.3984,316.4106,160.3984" style="stroke:#44546A;stroke-width:1;"/><line style="stroke:#44546A;stroke-width:1;" x1="316.4106" x2="316.4106" y1="214.3359" y2="234.3359"/><polygon fill="#44546A" points="312.4106,224.3359,316.4106,234.3359,320.4106,224.3359,316.4106,228.3359" style="stroke:#44546A;stroke-width:1;"/><line style="stroke:#44546A;stroke-width:1;" x1="316.4106" x2="316.4106" y1="312.3047" y2="336.707"/><polygon fill="#44546A" points="312.4106,326.707,316.4106,336.707,320.4106,326.707,316.4106,330.707" style="stroke:#44546A;stroke-width:1;"/><line style="stroke:#44546A;stroke-width:1